name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的 push 不打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 用当前 Active LTS（Krypton）。奇数版本（25/27）不承诺稳定性，不用于构建
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # 注意：不能加 --omit=optional。
      # vite 8 的 bundler（rolldown）原生二进制就在 optionalDependencies 里，
      # 跳过 optional 会直接构建失败（实测报 Cannot find native binding）。
      # 测试（vitest / e2e）一律在本地跑，CI 只负责「能构建、能部署」。
      - name: Install
        run: npm ci

      # 构建内含 tsc --noEmit：类型错误会让部署失败，这是唯一保留的质量闸门
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
