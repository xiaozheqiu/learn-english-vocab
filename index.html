      :root {

      }
      * {

      }
      body {
        margin: 0;
        padding: 18px;
        background: var(--bg);
        color: var(--txt);
        font:

      }
      .wrap {

        margin: 0 auto;
      }
      h1 {
        font-size: 19px;
        font-weight: 600;
        margin: 0 0 3px;
      }
      .sub {
        color: var(--sub);
        font-size: 12px;
        margin-bottom: 14px;
      }
      .bar {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 12px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .tab {
        padding: 5px 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
      }
      .tab.on {
        background: var(--ok-bg);
        border-color: var(--ok);
        color: #085041;
      }
      .row2 {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      input[type="search"] {
        flex: 1;
        min-width: 170px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        font-size: 13px;
      }
      .btn {
        padding: 6px 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        font-size: 12px;
        color: var(--txt);
      }
      .btn:hover {
        border-color: var(--ok);
      }
      .btn.on {
        background: var(--ok-bg);
        border-color: var(--ok);
        color: #085041;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .stat {
        margin-left: auto;
        font-size: 12px;
        color: var(--sub);
      }
      .bar2 {
        margin-top: 9px;
        height: 6px;
        background: var(--line);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar2 i {
        display: block;
        height: 100%;
        background: var(--ok);
        width: 0;
        transition: 0.2s;
      }
      .pager {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        padding: 9px 0;
        font-size: 12px;
        color: var(--sub);
      }
      .pager select {
        padding: 4px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        font-size: 12px;
      }
      .pager input[type="number"] {
        width: 60px;
        padding: 4px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        font-size: 12px;
        text-align: center;
        color: var(--txt);
      }
      .pager .sp {
        margin-left: auto;
      }
      table {
        width: 100%;
        table-layout: auto;
        border-collapse: collapse;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      th {
        position: sticky;
        top: 0;
        background: #f1efe8;
        text-align: left;
        font-weight: 500;
        font-size: 12px;
        color: var(--sub);
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      td {
        padding: 6px 10px;
        border-bottom: 1px solid #f0eee8;
        font-size: 13px;
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .num {
        color: #b4b2a9;
        font-size: 11px;
        white-space: nowrap;
      }
      .w {
        white-space: nowrap;
        font-weight: 500;
      }
      .w a {
        color: var(--link);
        text-decoration: none;
      }
      .w a:hover {
        text-decoration: underline;
      }
      .p {
        color: var(--sub);
        font-size: 12px;
        white-space: nowrap;
      }
      .src {
        display: inline-block;
        margin-left: 4px;
        padding: 0 4px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-size: 10px;
        color: var(--sub);
      }
      .cn {
        color: #444;
      }
      .nt {
        color: #b4b2a9;
        font-size: 11px;
      }
      .sw {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 22px;
      }
      .sw input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }
      .sw span {
        position: absolute;
        inset: 0;
        background: #d3d1c7;
        border-radius: 11px;
        cursor: pointer;
        transition: 0.15s;
      }
      .sw span::after {
        content: "";
        position: absolute;
        left: 2px;
        top: 2px;
        width: 18px;
        height: 18px;
        background: #fff;
        border-radius: 50%;
        transition: 0.15s;
      }
      .sw input:checked + span {
        background: var(--ok);
      }
      .sw input:checked + span::after {
        transform: translateX(18px);
      }
      tr.done .w a {
        color: #b4b2a9;
        text-decoration: line-through;
      }
      tr.done .cn {
        color: #b4b2a9;
      }
      .empty {
        padding: 30px;
        text-align: center;
        color: var(--sub);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .tip {
        margin-top: 10px;
        font-size: 12px;
        color: var(--sub);
        line-height: 1.8;
      }
    </style>

          cn: "和...同时，虽然",

        },
        {

          cn: "vt. 鞭打，搅拌 ／ vi. 拍击，急走",

        },
        {
          lv: "C1",
          w: "wholly",

          cn: "完全地，整个",

        },
        {
          lv: "C1",
          w: "widen",
          p: "v.",
          cn: "vt. 弄宽，加宽 ／ vi. 变宽，扩大",
          nt: "",
          sc: "5000",
        },
        { lv: "C1", w: "widow", p: "n.", cn: "寡妇，孀妇", nt: "", sc: "5000" },
        { lv: "C1", w: "width", p: "n.", cn: "宽度，宽广", nt: "", sc: "5000" },
        {
          lv: "C1",
          w: "willingness",
          p: "n.",
          cn: "乐意，心甘情愿",
          nt: "",
          sc: "5000",
        },
        {
          lv: "C1",
          w: "wipe",
          p: "v.",
          cn: "vt. 擦，揩 ／ vi. 擦，打",
          nt: "",
          sc: "5000",
        },
        { lv: "C1", w: "wit", p: "n.", cn: "机智，智力", nt: "", sc: "5000" },
        {
          lv: "C1",
          w: "withdrawal",
          p: "n.",
          cn: "提款，撤退",
          nt: "",
          sc: "5000",
        },
        {
          lv: "C1",
          w: "workout",
          p: "n.",
          cn: "试验，试用",
          nt: "",
          sc: "5000",
        },
        {
          lv: "C1",
          w: "worship",
          p: "n., v.",
          cn: "n. 崇拜，礼拜 ／ vt. 崇拜，尊敬",
          nt: "",
          sc: "5000",
        },
        {
          lv: "C1",
          w: "worthwhile",
          p: "adj.",
          cn: "值得花时间的，值得做的",
          nt: "",
          sc: "5000",
        },
        {
          lv: "C1",
          w: "worthy",
          p: "adj.",
          cn: "有价值的，可敬的",
          nt: "",
          sc: "5000",
        },
        {
          lv: "C1",
          w: "yell",
          p: "v.",
          cn: "vt. 喊叫着说 ／ vi. 叫喊，大叫",
          nt: "",
          sc: "5000",
        },
        {
          lv: "C1",
          w: "yield",
          p: "n., v.",
          cn: "n. 生产量，投资收益 ／ vt. 出产，给予",
          nt: "",
          sc: "5000",
        },
        {
          lv: "C1",
          w: "youngster",
          p: "n.",
          cn: "小孩，年轻人",
          nt: "",
          sc: "5000",
        },
      ];
      const KEY = "ox5000-mastered-v1";
      const TRANS = "https://fanyi.baidu.com/mtpe-individual/transText?query=";
      let done = new Set();
      try {
        done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
      } catch (e) {}

      let lv = "A1",
        mode = "all",
        kw = "",
        page = 1,
        size = 20;
      const LEVELS = ["A1", "A2", "B1", "B2", "C1", "ALL"];

      const keyOf = (d) => d.lv + "|" + d.w + "|" + d.p;
      const save = () => {
        try {
          localStorage.setItem(KEY, JSON.stringify([...done]));
        } catch (e) {}
      };
      const esc = (s) =>
        (s || "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const qw = (w) => encodeURIComponent(String(w).split(",")[0].trim());

      function baseSet() {
        return DATA.filter((d) => lv === "ALL" || d.lv === lv);
      }
      function filtered() {
        let a = baseSet();
        if (kw) {
          const k = kw.toLowerCase();
          a = a.filter(
            (d) =>
              d.w.toLowerCase().includes(k) ||
              (d.cn || "").toLowerCase().includes(k),
          );
        }
        if (mode === "todo") a = a.filter((d) => !done.has(keyOf(d)));
        if (mode === "done") a = a.filter((d) => done.has(keyOf(d)));
        return a;
      }

      function renderPager(total, pages, allDone, rowCount) {
        const h = `
    <button class="btn js-prev" ${page <= 1 ? "disabled" : ""}>上一页</button>
    <button class="btn js-next" ${page >= pages ? "disabled" : ""}>下一页</button>
    <button class="btn js-all" title="只作用于当前这一页显示的 ${rowCount} 条，不影响其他页" ${total ? "" : "disabled"}>${allDone ? "本页取消勾选" : "本页全部勾选"}（${rowCount}）</button>
    <span>第</span>
    <input class="js-jump" type="number" min="1" max="${pages || 1}" value="${page}">
    <span>/ ${pages || 1} 页</span>
    <select class="js-size">
      ${[20, 50, 100, 200, 500].map((n) => `<option value="${n}" ${n === size ? "selected" : ""}>每页 ${n}</option>`).join("")}
    </select>
    <span class="sp">共 ${total} 条</span>`;
        document.getElementById("pg-top").innerHTML = h;
        document.getElementById("pg-bot").innerHTML = h;
        ["pg-top", "pg-bot"].forEach((pid) => {
          const el = document.getElementById(pid);
          el.querySelector(".js-prev").onclick = () => {
            if (page > 1) {
              page--;
              render();
              toTop();
            }
          };
          el.querySelector(".js-next").onclick = () => {
            if (page < pages) {
              page++;
              render();
              toTop();
            }
          };
          el.querySelector(".js-size").onchange = (e) => {
            size = +e.target.value;
            page = 1;
            render();
          };
          el.querySelector(".js-all").onclick = () => {
            const a = filtered();
            const pgs = Math.max(1, Math.ceil(a.length / size));
            const p = Math.min(page, pgs);
            const rows = a.slice((p - 1) * size, p * size);
            const all = rows.length > 0 && rows.every((d) => done.has(keyOf(d)));
            rows.forEach((d) => (all ? done.delete(keyOf(d)) : done.add(keyOf(d))));
            save();
            render();
            toTop();
          };
          const jump = el.querySelector(".js-jump");
          const go = () => {
            const n = parseInt(jump.value, 10);
            if (!isNaN(n)) {
              page = Math.min(Math.max(1, n), pages);
              render();
              toTop();
            } else {
              render();
            }
          };
          jump.onkeydown = (e) => {
            if (e.key === "Enter") go();
          };
          jump.onchange = go;
        });
      }

      function toTop() {
        const y =
          document.getElementById("pg-top").getBoundingClientRect().top +
          window.scrollY -
          8;
        window.scrollTo({ top: y, behavior: "smooth" });
      }

      function render() {
        const a = filtered();
        const pages = Math.max(1, Math.ceil(a.length / size));
        if (page > pages) page = pages;
        const slice = a.slice((page - 1) * size, page * size);

        const base = baseSet();
        const nDone = base.filter((d) => done.has(keyOf(d))).length;
        document.getElementById("stat").textContent =
          `已掌握 ${nDone} / ${base.length}`;
        document.getElementById("prog").style.width =
          (base.length ? (nDone / base.length) * 100 : 0) + "%";

        renderPager(
          a.length,
          pages,
          slice.length > 0 && slice.every((d) => done.has(keyOf(d))),
          slice.length,
        );

        if (!a.length) {
          document.getElementById("list").innerHTML =
            '<div class="empty">没有匹配的词</div>';
          return;
        }

        let h =
          '<table><thead><tr><th>#</th><th>单词</th><th>词性</th><th>中文释义</th><th>备注</th><th style="width:52px">掌握</th></tr></thead><tbody>';
        const start = (page - 1) * size;
        slice.forEach((d, i) => {
          const k = keyOf(d),
            on = done.has(k);
          h +=
            `<tr class="${on ? "done" : ""}">` +
            `<td class="num">${start + i + 1}</td>` +
            `<td class="w"><a href="${TRANS}${qw(d.w)}&amp;lang=en2zh" target="_blank" rel="noopener">${esc(d.w)}</a></td>` +
            `<td class="p">${esc(d.p)}${d.sc ? `<span class="src">${d.sc}</span>` : ""}</td>` +
            `<td class="cn">${esc(d.cn)}</td>` +
            `<td class="nt">${esc(d.nt)}</td>` +
            `<td><label class="sw"><input type="checkbox" data-k="${esc(k)}" ${on ? "checked" : ""}><span></span></label></td>` +
            "</tr>";
        });
        document.getElementById("list").innerHTML = h + "</tbody></table>";

        document.querySelectorAll(".sw input").forEach((el) => {
          el.addEventListener("change", (e) => {
            const k = e.target.dataset.k;
            e.target.checked ? done.add(k) : done.delete(k);
            save();
            e.target.closest("tr").classList.toggle("done", e.target.checked);
            if (mode === "all") updStat();
            else render();
          });
        });
      }

      function updStat() {
        const base = baseSet();
        const nDone = base.filter((d) => done.has(keyOf(d))).length;
        document.getElementById("stat").textContent =
          `已掌握 ${nDone} / ${base.length}`;
        document.getElementById("prog").style.width =
          (base.length ? (nDone / base.length) * 100 : 0) + "%";
      }

      const tabs = document.getElementById("tabs");
      LEVELS.forEach((l) => {
        const b = document.createElement("button");
        b.className = "tab" + (l === lv ? " on" : "");
        b.textContent = l === "ALL" ? "全部" : l;
        b.onclick = () => {
          lv = l;
          page = 1;
          [...tabs.children].forEach((x) => x.classList.remove("on"));
          b.classList.add("on");
          render();
        };
        tabs.appendChild(b);
      });

      document.getElementById("q").addEventListener("input", (e) => {
        kw = e.target.value.trim();
        page = 1;
        render();
      });
      document.querySelectorAll("[data-m]").forEach((b) => {
        b.onclick = () => {
          mode = b.dataset.m;
          page = 1;
          document
            .querySelectorAll("[data-m]")
            .forEach((x) => x.classList.toggle("on", x === b));
          render();
        };
      });

      render();
    </script>
  </body>
</html>
