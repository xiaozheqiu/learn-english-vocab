<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>window.OX=window.OX||{}</script>
    <script defer src="data/A1.js"></script>
    <title>Oxford 5000 词汇表</title>
    <meta name="description" content="Oxford 3000 / 5000 分级词汇表（A1–C1，5323 条），可勾选标记已掌握，进度存在本机。" />
    <meta name="theme-color" content="#1d9e75" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Oxford 5000" />
    <style>
      :root {
        --bg: #faf9f7;
        --card: #fff;
        --line: #e3e1da;
        --txt: #2c2c2a;
        --sub: #5f5e5a;
        --ok: #1d9e75;
        --ok-bg: #e1f5ee;
        --link: #185fa5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 18px;
        background: var(--bg);
        color: var(--txt);
        font:
          14px/1.6 -apple-system,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        font-size: 19px;
        font-weight: 600;
        margin: 0 0 3px;
      }
      .sub {
        color: var(--sub);
        font-size: 12px;
        margin-bottom: 14px;
      }
      .bar {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 12px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .tab {
        padding: 5px 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
        color: var(--txt);
        position: relative;
      }
      .tab.on {
        background: var(--ok-bg);
        border-color: var(--ok);
        color: #085041;
      }
      .tab .dot {
        display: none;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--ok);
        margin-left: 5px;
        vertical-align: middle;
      }
      .tab.busy .dot {
        display: inline-block;
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.2;
        }
      }
      .row2 {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      input[type="search"] {
        flex: 1;
        min-width: 170px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        font-size: 13px;
      }
      .btn {
        padding: 6px 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        font-size: 12px;
        color: var(--txt);
      }
      .btn:hover {
        border-color: var(--ok);
      }
      .btn.on {
        background: var(--ok-bg);
        border-color: var(--ok);
        color: #085041;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .stat {
        margin-left: auto;
        font-size: 12px;
        color: var(--sub);
      }
      .bar2 {
        margin-top: 9px;
        height: 6px;
        background: var(--line);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar2 i {
        display: block;
        height: 100%;
        background: var(--ok);
        width: 0;
        transition: 0.2s;
      }
      .pager {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        padding: 9px 0;
        font-size: 12px;
        color: var(--sub);
      }
      .pager select {
        padding: 4px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        font-size: 12px;
      }
      .pager input[type="number"] {
        width: 60px;
        padding: 4px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        font-size: 12px;
        text-align: center;
        color: var(--txt);
      }
      .pager .sp {
        margin-left: auto;
      }
      table {
        width: 100%;
        table-layout: auto;
        border-collapse: collapse;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      th {
        position: sticky;
        top: 0;
        background: #f1efe8;
        text-align: left;
        font-weight: 500;
        font-size: 12px;
        color: var(--sub);
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      td {
        padding: 6px 10px;
        border-bottom: 1px solid #f0eee8;
        font-size: 13px;
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .num {
        color: #b4b2a9;
        font-size: 11px;
        white-space: nowrap;
      }
      .w {
        white-space: nowrap;
        font-weight: 500;
      }
      .w a {
        color: var(--link);
        text-decoration: none;
      }
      .w a:hover {
        text-decoration: underline;
      }
      .p {
        color: var(--sub);
        font-size: 12px;
        white-space: nowrap;
      }
      .src {
        display: inline-block;
        margin-left: 4px;
        padding: 0 4px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-size: 10px;
        color: var(--sub);
      }
      .cn {
        color: #444;
      }
      /* 词义提示：原来"备注"列里区分同形词的那部分，并入释义格 */
      .sn {
        color: #b4b2a9;
        font-size: 11px;
        margin-left: 4px;
      }
      .sw {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 22px;
      }
      .sw input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }
      .sw span {
        position: absolute;
        inset: 0;
        background: #d3d1c7;
        border-radius: 11px;
        cursor: pointer;
        transition: 0.15s;
      }
      .sw span::after {
        content: "";
        position: absolute;
        left: 2px;
        top: 2px;
        width: 18px;
        height: 18px;
        background: #fff;
        border-radius: 50%;
        transition: 0.15s;
      }
      .sw input:checked + span {
        background: var(--ok);
      }
      .sw input:checked + span::after {
        transform: translateX(18px);
      }
      tr.done .w a {
        color: #b4b2a9;
        text-decoration: line-through;
      }
      tr.done .cn {
        color: #b4b2a9;
      }
      .empty {
        padding: 30px;
        text-align: center;
        color: var(--sub);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .tip {
        margin-top: 10px;
        font-size: 12px;
        color: var(--sub);
        line-height: 1.8;
      }
      #loadbar {
        position: fixed;
        left: 0;
        top: 0;
        height: 3px;
        width: 0;
        background: var(--ok);
        transition: width 0.25s;
        z-index: 99;
      }
      #loadbar.off {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="loadbar" class="off"></div>
    <div class="wrap">
      <h1>Oxford 5000 词汇表 · 可勾选版</h1>
      <div class="sub">
        共 5323 条 · 点单词查百度翻译 · 拨开关标记已掌握 · 进度存在本机浏览器里
      </div>

      <div class="bar">
        <div class="tabs" id="tabs"></div>
        <div class="row2">
          <input type="search" id="q" placeholder="搜索单词或中文释义…" />
          <button class="btn on" data-m="all">全部</button>
          <button class="btn" data-m="todo">未掌握</button>
          <button class="btn" data-m="done">已掌握</button>
          <span class="stat" id="stat"></span>
        </div>
        <div class="bar2"><i id="prog"></i></div>
      </div>

      <div class="pager" id="pg-top"></div>
      <div id="list">
        <div class="empty">正在加载词表…</div>
      </div>
      <div class="pager" id="pg-bot"></div>
    </div>

    <script>
      const KEY = "ox5000-mastered-v1";
      const TRANS = "https://fanyi.baidu.com/mtpe-individual/transText?query=";
      const LV = ["A1", "A2", "B1", "B2", "C1"];
      const LEVELS = LV.concat(["ALL"]);

      let done = new Set();
      try {
        done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
      } catch (e) {}

      let lv = "A1",
        mode = "all",
        kw = "",
        page = 1,
        size = 20;

      const STORE = {}; // 已加载等级的原生数据
      const loaded = new Set();
      const inflight = {};

      const esc = (s) =>
        (s || "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const qw = (w) => encodeURIComponent(String(w).split(",")[0].trim());

      /* ---------- 数据加载 ---------- */
      // 数据文件形如：window.OX.A1 = [[单词, 词性, 释义, 来源, 词义提示], ...]
      // 用 <script> 注入而不是 fetch()，这样 file:// 双击打开也能用
      function ingest(L) {
        const rows = (window.OX && window.OX[L]) || [];
        const arr = rows.map((r) => ({
          lv: L,
          w: r[0],
          p: r[1],
          cn: r[2],
          sc: r[3],
          sn: r[4] || "",
          _k: "",
        }));
        // 同等级下 (词, 词性) 重复时给 key 加序号，避免两条词共用一个勾
        const cnt = {};
        for (const d of arr) {
          const b = d.lv + "|" + d.w + "|" + d.p;
          cnt[b] = (cnt[b] || 0) + 1;
        }
        const seen = {};
        for (const d of arr) {
          const b = d.lv + "|" + d.w + "|" + d.p;
          if (cnt[b] > 1) {
            seen[b] = (seen[b] || 0) + 1;
            d._k = b + "|" + seen[b];
          } else d._k = b;
        }
        return arr;
      }

      function register(L) {
        if (loaded.has(L)) return;
        STORE[L] = ingest(L);
        loaded.add(L);
      }

      function loadLevel(L) {
        if (loaded.has(L)) return Promise.resolve();
        if (inflight[L]) return inflight[L];
        inflight[L] = new Promise((res, rej) => {
          const s = document.createElement("script");
          s.src = "data/" + L + ".js";
          s.onload = () => {
            delete inflight[L];
            register(L);
            res();
          };
          s.onerror = () => {
            delete inflight[L];
            rej(new Error("加载 " + L + " 失败"));
          };
          document.head.appendChild(s);
        });
        return inflight[L];
      }

      const needOf = (l) => (l === "ALL" ? LV : [l]);

      function setLoadBar(doneN, total) {
        const el = document.getElementById("loadbar");
        if (total == null) {
          el.classList.add("off");
          el.style.width = "0";
        } else {
          el.classList.remove("off");
          el.style.width = (total ? (doneN / total) * 100 : 100) + "%";
        }
        document.querySelectorAll(".tab").forEach((b) => {
          b.classList.toggle("busy", total != null && !loaded.has(b.dataset.lv));
        });
      }

      // 需要哪个等级就只加载哪个；"全部"才加载全部
      async function ensure(l) {
        const todo = needOf(l).filter((x) => !loaded.has(x));
        if (!todo.length) return;
        let n = 0;
        setLoadBar(n, todo.length);
        if (!Object.keys(STORE).length) renderState("正在加载词表…");
        await Promise.all(
          todo.map(async (x) => {
            try {
              await loadLevel(x);
            } catch (e) {
              renderState("加载失败：" + x + "。请检查网络后刷新。");
              throw e;
            }
            setLoadBar(++n, todo.length);
          }),
        );
        setLoadBar(0, null);
      }

      /* ---------- 筛选 / 渲染 ---------- */
      // 当前等级（或"全部"）的集合：只统计进度用
      function levelSet() {
        let a = [];
        for (const L of needOf(lv)) if (STORE[L]) a = a.concat(STORE[L]);
        return a;
      }
      // 列表实际取数范围：搜索时跨全部等级，否则只看当前等级
      function baseSet() {
        if (!kw) return levelSet();
        let a = [];
        for (const L of LV) if (STORE[L]) a = a.concat(STORE[L]);
        return a;
      }
      function filtered() {
        let a = baseSet();
        if (kw) {
          const k = kw.toLowerCase();
          a = a.filter(
            (d) =>
              d.w.toLowerCase().includes(k) ||
              (d.cn || "").toLowerCase().includes(k),
          );
        }
        if (mode === "todo") a = a.filter((d) => !done.has(d._k));
        if (mode === "done") a = a.filter((d) => done.has(d._k));
        return a;
      }

      function renderSearching() {
        document.getElementById("list").innerHTML =
          '<div class="empty">正在加载全部等级的词表以便搜索…</div>';
      }

      function renderState(msg) {
        document.getElementById("list").innerHTML =
          '<div class="empty">' + esc(msg) + "</div>";
        document.getElementById("pg-top").innerHTML = "";
        document.getElementById("pg-bot").innerHTML = "";
      }

      function renderPager(total, pages, allDone, rowCount) {
        const h = `
    <button class="btn js-prev" ${page <= 1 ? "disabled" : ""}>上一页</button>
    <button class="btn js-next" ${page >= pages ? "disabled" : ""}>下一页</button>
    <button class="btn js-all" title="只作用于当前这一页显示的 ${rowCount} 条，不影响其他页" ${total ? "" : "disabled"}>${allDone ? "本页取消勾选" : "本页全部勾选"}（${rowCount}）</button>
    <span>第</span>
    <input class="js-jump" type="number" min="1" max="${pages || 1}" value="${page}">
    <span>/ ${pages || 1} 页</span>
    <select class="js-size">
      ${[20, 50, 100, 200, 500].map((n) => `<option value="${n}" ${n === size ? "selected" : ""}>每页 ${n}</option>`).join("")}
    </select>
    <span class="sp">共 ${total} 条</span>`;
        document.getElementById("pg-top").innerHTML = h;
        document.getElementById("pg-bot").innerHTML = h;
        ["pg-top", "pg-bot"].forEach((pid) => {
          const el = document.getElementById(pid);
          el.querySelector(".js-prev").onclick = () => {
            if (page > 1) {
              page--;
              render();
              toTop();
            }
          };
          el.querySelector(".js-next").onclick = () => {
            if (page < pages) {
              page++;
              render();
              toTop();
            }
          };
          el.querySelector(".js-size").onchange = (e) => {
            size = +e.target.value;
            page = 1;
            render();
          };
          el.querySelector(".js-all").onclick = () => {
            const a = filtered();
            const pgs = Math.max(1, Math.ceil(a.length / size));
            const p = Math.min(page, pgs);
            const rows = a.slice((p - 1) * size, p * size);
            const all = rows.length > 0 && rows.every((d) => done.has(d._k));
            rows.forEach((d) => (all ? done.delete(d._k) : done.add(d._k)));
            save();
            render();
            toTop();
          };
          const jump = el.querySelector(".js-jump");
          const go = () => {
            const n = parseInt(jump.value, 10);
            if (!isNaN(n)) {
              page = Math.min(Math.max(1, n), pages);
              render();
              toTop();
            } else {
              render();
            }
          };
          jump.onkeydown = (e) => {
            if (e.key === "Enter") go();
          };
          jump.onchange = go;
        });
      }

      function toTop() {
        const y =
          document.getElementById("pg-top").getBoundingClientRect().top +
          window.scrollY -
          8;
        window.scrollTo({ top: y, behavior: "smooth" });
      }

      function render() {
        const a = filtered();
        const pages = Math.max(1, Math.ceil(a.length / size));
        if (page > pages) page = pages;
        const slice = a.slice((page - 1) * size, page * size);

        // 进度始终按"当前等级"统计，搜索跨等级时也不跟着变
        const base = levelSet();
        const nDone = base.filter((d) => done.has(d._k)).length;
        document.getElementById("stat").textContent =
          `已掌握 ${nDone} / ${base.length}`;
        document.getElementById("prog").style.width =
          (base.length ? (nDone / base.length) * 100 : 0) + "%";

        renderPager(
          a.length,
          pages,
          slice.length > 0 && slice.every((d) => done.has(d._k)),
          slice.length,
        );

        if (!a.length) {
          document.getElementById("list").innerHTML =
            '<div class="empty">没有匹配的词</div>';
          return;
        }

        let h =
          '<table><thead><tr><th>#</th><th>单词</th><th>词性</th><th>中文释义</th><th style="width:52px">掌握</th></tr></thead><tbody>';
        const start = (page - 1) * size;
        slice.forEach((d, i) => {
          const on = done.has(d._k);
          h +=
            `<tr class="${on ? "done" : ""}">` +
            `<td class="num">${start + i + 1}</td>` +
            `<td class="w"><a href="${TRANS}${qw(d.w)}&amp;lang=en2zh" target="_blank" rel="noopener">${esc(d.w)}</a></td>` +
            `<td class="p">${esc(d.p)}${d.sc ? `<span class="src">${d.sc}</span>` : ""}</td>` +
            `<td class="cn">${esc(d.cn)}${d.sn ? `<span class="sn">（${esc(d.sn)}）</span>` : ""}</td>` +
            `<td><label class="sw"><input type="checkbox" data-k="${esc(d._k)}" ${on ? "checked" : ""}><span></span></label></td>` +
            "</tr>";
        });
        document.getElementById("list").innerHTML = h + "</tbody></table>";

        document.querySelectorAll(".sw input").forEach((el) => {
          el.addEventListener("change", (e) => {
            const k = e.target.dataset.k;
            e.target.checked ? done.add(k) : done.delete(k);
            save();
            e.target.closest("tr").classList.toggle("done", e.target.checked);
            if (mode === "all") updStat();
            else render();
          });
        });
      }

      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify([...done]));
        } catch (e) {}
      }

      function updStat() {
        // 进度始终按"当前等级"统计，搜索跨等级时也不跟着变
        const base = levelSet();
        const nDone = base.filter((d) => done.has(d._k)).length;
        document.getElementById("stat").textContent =
          `已掌握 ${nDone} / ${base.length}`;
        document.getElementById("prog").style.width =
          (base.length ? (nDone / base.length) * 100 : 0) + "%";
      }

      /* ---------- 界面 ---------- */
      function buildTabs() {
        const tabs = document.getElementById("tabs");
        tabs.innerHTML = "";
        LEVELS.forEach((l) => {
          const b = document.createElement("button");
          b.className = "tab" + (l === lv ? " on" : "");
          b.dataset.lv = l;
          b.innerHTML =
            (l === "ALL" ? "全部" : l) + '<i class="dot"></i>';
          b.onclick = async () => {
            if (lv === l) return;
            lv = l;
            page = 1;
            [...tabs.children].forEach((x) => x.classList.remove("on"));
            b.classList.add("on");
            await ensure(l);
            render();
          };
          tabs.appendChild(b);
        });
      }

      document.getElementById("q").addEventListener("input", async (e) => {
        kw = e.target.value.trim();
        page = 1;
        // 搜索要覆盖全部等级，所以搜索时后台把还没加载的等级补齐
        if (kw) {
          renderSearching();
          try {
            await ensure("ALL");
          } catch (err) {
            return;
          }
        }
        render();
      });
      document.querySelectorAll("[data-m]").forEach((b) => {
        b.onclick = () => {
          mode = b.dataset.m;
          page = 1;
          document
            .querySelectorAll("[data-m]")
            .forEach((x) => x.classList.toggle("on", x === b));
          render();
        };
      });

      async function boot() {
        // 单文件版会把全部数据内联进 window.OX；PWA 版只预载 A1
        for (const L of Object.keys(window.OX || {})) register(L);
        buildTabs();
        await ensure(lv);
        render();

        if ("serviceWorker" in navigator && location.protocol !== "file:") {
          addEventListener("load", () => {
            navigator.serviceWorker.register("sw.js").catch(() => {});
          });
        }
      }

      // defer 的 data/A1.js 会在 DOMContentLoaded 之前执行完，所以这里一定能拿到 A1
      document.addEventListener("DOMContentLoaded", boot);
    </script>
  </body>
</html>
